# Ruff's default rule set is not stable across releases. 0.16 widened it, which
# turned 77 new findings into a red CI run on server code that had not changed
# in the pull request at all.
#
# So the rules are pinned here rather than inherited. These four are ruff's
# historic defaults — pyflakes plus the pycodestyle errors that catch real
# mistakes — and they are what this project has actually been linted against
# since M0.
#
# Widening this list is a fine thing to do deliberately (SIM and B have useful
# rules in them); it is not a fine thing to have happen to you mid-PR.
[lint]
select = ["E4", "E7", "E9", "F"]
